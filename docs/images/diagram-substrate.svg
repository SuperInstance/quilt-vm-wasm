<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <filter id="dotglow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#94A3B8"/>
    </marker>
    <marker id="arrow2wayStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="8,0 0,4 8,8" fill="#94A3B8"/>
    </marker>
    <marker id="arrow2wayEnd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#0F172A"/>
  <text x="20" y="32" fill="#E2E8F0" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700">The Substrate — a cell-graph</text>
  <text x="20" y="52" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="12">5 opcodes, 5 actions, one universal material</text>
  <!-- cells (dots) -->
  <g filter="url(#dotglow)">
    <circle cx="120" cy="140" r="14" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
    <text x="120" y="178" text-anchor="middle" fill="#BFDBFE" font-family="ui-monospace,monospace" font-size="11">bathy:0</text>
    <text x="120" y="118" text-anchor="middle" fill="#FFF" font-family="ui-monospace,monospace" font-size="9">4.2</text>

    <circle cx="280" cy="100" r="14" fill="#10B981" stroke="#064E3B" stroke-width="2"/>
    <text x="280" y="138" text-anchor="middle" fill="#A7F3D0" font-family="ui-monospace,monospace" font-size="11">tide</text>
    <text x="280" y="78" text-anchor="middle" fill="#FFF" font-family="ui-monospace,monospace" font-size="9">+1.2</text>

    <circle cx="280" cy="220" r="14" fill="#A855F7" stroke="#581C87" stroke-width="2"/>
    <text x="280" y="258" text-anchor="middle" fill="#E9D5FF" font-family="ui-monospace,monospace" font-size="11">salinity</text>
    <text x="280" y="198" text-anchor="middle" fill="#FFF" font-family="ui-monospace,monospace" font-size="9">35‰</text>

    <circle cx="440" cy="160" r="14" fill="#F59E0B" stroke="#92400E" stroke-width="2"/>
    <text x="440" y="198" text-anchor="middle" fill="#FDE68A" font-family="ui-monospace,monospace" font-size="11">viewpoint</text>
    <text x="440" y="138" text-anchor="middle" fill="#FFF" font-family="ui-monospace,monospace" font-size="9">"4.2 m"</text>

    <circle cx="540" cy="100" r="14" fill="#06B6D4" stroke="#164E63" stroke-width="2"/>
    <text x="540" y="138" text-anchor="middle" fill="#A5F3FC" font-family="ui-monospace,monospace" font-size="11">logger</text>

    <circle cx="540" cy="220" r="14" fill="#DC2626" stroke="#7F1D1D" stroke-width="2"/>
    <text x="540" y="258" text-anchor="middle" fill="#FECACA" font-family="ui-monospace,monospace" font-size="11">effect</text>
  </g>
  <!-- LINK arrows (depends_on) -->
  <g stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)">
    <line x1="135" y1="135" x2="265" y2="105"/>
    <line x1="135" y1="148" x2="265" y2="215"/>
    <line x1="295" y1="100" x2="525" y2="100"/>
    <line x1="455" y1="155" x2="540" y2="100"/>
  </g>
  <text x="200" y="115" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="9" font-style="italic">depends_on</text>
  <text x="200" y="200" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="9" font-style="italic">coeffect</text>
  <text x="400" y="92" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="9" font-style="italic">reads</text>
  <text x="490" y="125" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="9" font-style="italic">observes</text>
  <!-- EFFECT double-headed arrow -->
  <line x1="455" y1="170" x2="525" y2="215" stroke="#94A3B8" stroke-width="1.5" marker-start="url(#arrow2wayStart)" marker-end="url(#arrow2wayEnd)"/>
  <text x="490" y="200" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="9" font-style="italic">inc ↔ dec</text>
  <!-- VIEW magnifier over bathy:0 -->
  <g transform="translate(96,116)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <line x1="6" y1="6" x2="14" y2="14" stroke="#F59E0B" stroke-width="2"/>
  </g>
  <text x="78" y="100" fill="#F59E0B" font-family="ui-monospace,monospace" font-size="9" font-style="italic">VIEW</text>
  <!-- TICK clockwork in the corner -->
  <g transform="translate(580,290)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <line x1="0" y1="-14" x2="0" y2="-20" stroke="#94A3B8" stroke-width="2"/>
    <line x1="0" y1="14" x2="0" y2="20" stroke="#94A3B8" stroke-width="2"/>
    <line x1="-14" y1="0" x2="-20" y2="0" stroke="#94A3B8" stroke-width="2"/>
    <line x1="14" y1="0" x2="20" y2="0" stroke="#94A3B8" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#F59E0B" stroke-width="2"/>
    <line x1="0" y1="0" x2="9" y2="4" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="0" cy="0" r="1.5" fill="#F59E0B"/>
  </g>
  <text x="560" y="338" text-anchor="end" fill="#F59E0B" font-family="ui-monospace,monospace" font-size="10" font-style="italic">TICK dt=1.0</text>
  <!-- legend at the bottom -->
  <g font-family="ui-sans-serif,system-ui" font-size="11" fill="#CBD5E1">
    <text x="20" y="310" font-weight="700" fill="#E2E8F0">5 opcodes</text>
    <text x="20" y="330">BIND: <tspan fill="#3B82F6">●</tspan> paints a cell</text>
    <text x="220" y="330">LINK: <tspan fill="#94A3B8">→</tspan> typed arrow</text>
    <text x="370" y="330">EFFECT: <tspan fill="#94A3B8">⇄</tspan> reversible</text>
    <text x="500" y="330">VIEW: <tspan fill="#F59E0B">🔍</tspan> projection</text>
    <text x="20" y="350">TICK: <tspan fill="#F59E0B">⏰</tspan> advance time</text>
  </g>
</svg>
