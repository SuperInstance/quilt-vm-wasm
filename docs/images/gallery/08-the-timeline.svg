<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="softglow8">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#FCD34D"/>
    </marker>
  </defs>
  <rect width="640" height="320" fill="#0F172A"/>

  <!-- title -->
  <text x="20" y="28" fill="#E2E8F0" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700">The Timeline</text>
  <text x="20" y="46" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="11">From a cowboy loop in 2024 to 15 polyformalism stories in 2027</text>

  <!-- main horizontal timeline line at y=190 -->
  <line x1="40" y1="190" x2="600" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow8)"/>
  <line x1="40" y1="190" x2="40" y2="190" stroke="#FCD34D" stroke-width="3"/>

  <!-- 4 year ticks: 2024, 2025, 2026, 2027+ -->
  <g font-family="ui-sans-serif,system-ui" font-size="11" fill="#E2E8F0" text-anchor="middle" font-weight="700">
    <line x1="80" y1="184" x2="80" y2="196" stroke="#FCD34D" stroke-width="2"/>
    <text x="80" y="218">2024</text>
    <line x1="240" y1="184" x2="240" y2="196" stroke="#FCD34D" stroke-width="2"/>
    <text x="240" y="218">2025</text>
    <line x1="400" y1="184" x2="400" y2="196" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="218">2026</text>
    <line x1="560" y1="184" x2="560" y2="196" stroke="#FCD34D" stroke-width="2"/>
    <text x="560" y="218">2027+</text>
  </g>

  <!-- 6 milestones, alternating above and below -->
  <!-- 1. V4.0-cowboy-loop at x=80 (2024), above -->
  <g transform="translate(80,140)">
    <line x1="0" y1="40" x2="0" y2="50" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="0" cy="40" r="4" fill="#F59E0B"/>
    <rect x="-50" y="0" width="100" height="38" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="0" y="14" text-anchor="middle" fill="#FDE68A" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">V4.0</text>
    <text x="0" y="28" text-anchor="middle" fill="#FCD34D" font-family="ui-sans-serif,system-ui" font-size="8">cowboy loop</text>
  </g>

  <!-- 2. 5-opcode VM at x=190 (late 2024), below -->
  <g transform="translate(190,238)">
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="0" cy="-48" r="4" fill="#3B82F6"/>
    <rect x="-50" y="0" width="100" height="38" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text x="0" y="14" text-anchor="middle" fill="#BFDBFE" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">5-opcode VM</text>
    <text x="0" y="28" text-anchor="middle" fill="#93C5FD" font-family="ui-sans-serif,system-ui" font-size="8">5 words, infinite worlds</text>
  </g>

  <!-- 3. 4 language ports at x=300 (early 2025), above -->
  <g transform="translate(300,140)">
    <line x1="0" y1="40" x2="0" y2="50" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="0" cy="40" r="4" fill="#10B981"/>
    <rect x="-50" y="0" width="100" height="38" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="0" y="14" text-anchor="middle" fill="#A7F3D0" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">4 ports</text>
    <text x="0" y="28" text-anchor="middle" fill="#6EE7B7" font-family="ui-sans-serif,system-ui" font-size="8">Py/Rs/C/TS</text>
  </g>

  <!-- 4. 7-layer polyformalism at x=400 (2026), below -->
  <g transform="translate(400,238)">
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#A855F7" stroke-width="1.5"/>
    <circle cx="0" cy="-48" r="4" fill="#A855F7"/>
    <rect x="-50" y="0" width="100" height="38" rx="4" fill="#1E293B" stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="14" text-anchor="middle" fill="#E9D5FF" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">7 layers</text>
    <text x="0" y="28" text-anchor="middle" fill="#C4B5FD" font-family="ui-sans-serif,system-ui" font-size="8">polyformalism</text>
  </g>

  <!-- 5. 15 stories + metal-track repos at x=500 (2026 late), above -->
  <g transform="translate(500,140)">
    <line x1="0" y1="40" x2="0" y2="50" stroke="#DC2626" stroke-width="1.5"/>
    <circle cx="0" cy="40" r="4" fill="#DC2626"/>
    <rect x="-50" y="0" width="100" height="38" rx="4" fill="#1E293B" stroke="#DC2626" stroke-width="1"/>
    <text x="0" y="14" text-anchor="middle" fill="#FCA5A5" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">15 stories</text>
    <text x="0" y="28" text-anchor="middle" fill="#F87171" font-family="ui-sans-serif,system-ui" font-size="8">+ metal repos</text>
  </g>

  <!-- 6. rich READMEs at x=580 (2027+), below -->
  <g transform="translate(580,238)">
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#FCD34D" stroke-width="1.5"/>
    <circle cx="0" cy="-48" r="4" fill="#FCD34D"/>
    <rect x="-30" y="0" width="60" height="38" rx="4" fill="#1E293B" stroke="#FCD34D" stroke-width="1"/>
    <text x="0" y="14" text-anchor="middle" fill="#FDE68A" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">rich</text>
    <text x="0" y="28" text-anchor="middle" fill="#FCD34D" font-family="ui-sans-serif,system-ui" font-size="8">READMEs</text>
  </g>

  <!-- bottom label -->
  <text x="320" y="298" text-anchor="middle" fill="#475569" font-family="ui-sans-serif,system-ui" font-size="9" font-style="italic">the cowboy rides from 2024 to wherever the trail goes next</text>
</svg>
