<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <radialGradient id="substrate4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0"/>
    </radialGradient>
    <filter id="bubble4">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="#0F172A"/>

  <!-- title -->
  <text x="20" y="28" fill="#E2E8F0" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700">The 15 Grammars</text>
  <text x="20" y="46" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="11">The same five words, spoken in 15 ways around one center</text>

  <!-- center substrate glow -->
  <circle cx="320" cy="200" r="40" fill="url(#substrate4)"/>
  <circle cx="320" cy="200" r="22" fill="#1E293B" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="320" y="198" text-anchor="middle" fill="#FCD34D" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">substrate</text>
  <text x="320" y="210" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="8">5 opcodes</text>

  <!-- 15 speech bubbles arranged in a circle, radius ~ 110 -->
  <!-- angles: every 24 degrees, starting at top (-90) -->
  <g font-family="ui-sans-serif,system-ui" font-size="9" font-weight="700" filter="url(#bubble4)">
    <!-- 1: English (top) -90deg -->
    <g transform="translate(320, 90)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#BFDBFE">"Bind it."</text>
    </g>
    <!-- 2: Spanish -66deg (sin=-0.914, cos=0.407): x=320+110*0.407=364.8, y=200-110*0.914=99.5 -->
    <g transform="translate(365, 100)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#A7F3D0">"Únalo."</text>
    </g>
    <!-- 3: French -42deg (cos=0.743, sin=0.669): x=320+81.7=401.7, y=200-73.6=126.4 -->
    <g transform="translate(402, 126)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#E9D5FF">"Liez-le."</text>
    </g>
    <!-- 4: German -18deg (cos=0.951, sin=0.309): x=320+104.6=424.6, y=200-34=166 -->
    <g transform="translate(425, 166)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#FDE68A">"Binde es."</text>
    </g>
    <!-- 5: Italian 6deg (cos=0.995, sin=-0.105): x=320+109.4=429.4, y=200+11.5=211.5 -->
    <g transform="translate(429, 212)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#FCA5A5">"Legalo."</text>
    </g>
    <!-- 6: Portuguese 30deg (cos=0.866, sin=-0.5): x=320+95.3=415.3, y=200+55=255 -->
    <g transform="translate(415, 255)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#A5F3FC">"Ligue-o."</text>
    </g>
    <!-- 7: Russian 54deg (cos=0.588, sin=-0.809): x=320+64.7=384.7, y=200+89=289 -->
    <g transform="translate(385, 289)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#FCD34D" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#FCD34D" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#FDE68A">"Свяжи."</text>
    </g>
    <!-- 8: Japanese 78deg (cos=0.208, sin=-0.978): x=320+22.9=342.9, y=200+107.6=307.6 -->
    <g transform="translate(343, 308)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#F9A8D4">"結べ。"</text>
    </g>
    <!-- 9: Chinese 102deg (cos=-0.208, sin=-0.978): x=320-22.9=297.1, y=200+107.6=307.6 -->
    <g transform="translate(297, 308)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#BFDBFE">"绑定。"</text>
    </g>
    <!-- 10: Korean 126deg (cos=-0.588, sin=-0.809): x=320-64.7=255.3, y=200+89=289 -->
    <g transform="translate(255, 289)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#A7F3D0">"묶어라."</text>
    </g>
    <!-- 11: Arabic 150deg (cos=-0.866, sin=-0.5): x=320-95.3=224.7, y=200+55=255 -->
    <g transform="translate(225, 255)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#E9D5FF">"اربط."</text>
    </g>
    <!-- 12: Hebrew 174deg (cos=-0.995, sin=-0.105): x=320-109.4=210.6, y=200+11.5=211.5 -->
    <g transform="translate(211, 212)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#FDE68A">"קשור."</text>
    </g>
    <!-- 13: Hindi 198deg (cos=-0.951, sin=0.309): x=320-104.6=215.4, y=200-34=166 -->
    <g transform="translate(215, 166)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#FCA5A5">"बाँधो।"</text>
    </g>
    <!-- 14: Swahili 222deg (cos=-0.743, sin=0.669): x=320-81.7=238.3, y=200-73.6=126.4 -->
    <g transform="translate(238, 126)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#A5F3FC">"Funga."</text>
    </g>
    <!-- 15: Yoruba 246deg (cos=-0.407, sin=0.914): x=320-44.8=275.2, y=200-100.5=99.5 -->
    <g transform="translate(275, 100)">
      <rect x="-26" y="-10" width="52" height="18" rx="9" fill="#1E293B" stroke="#FCD34D" stroke-width="1.5"/>
      <polygon points="-3,8 0,14 3,8" fill="#1E293B" stroke="#FCD34D" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#FDE68A">"Dè."</text>
    </g>
  </g>

  <!-- LINK arrows between consecutive bubbles (curved, around the outside) -->
  <g fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.7">
    <path d="M 348 96 Q 354 88 360 94"/>
    <path d="M 388 104 Q 392 112 398 122"/>
    <path d="M 422 142 Q 430 152 422 162"/>
    <path d="M 432 188 Q 436 198 432 208"/>
    <path d="M 422 232 Q 430 240 422 250"/>
    <path d="M 398 280 Q 392 286 388 286"/>
    <path d="M 364 304 Q 360 304 354 304"/>
    <path d="M 320 318 Q 312 316 308 312"/>
    <path d="M 276 304 Q 270 304 266 300"/>
    <path d="M 242 280 Q 236 278 232 274"/>
    <path d="M 208 232 Q 200 240 202 250"/>
    <path d="M 200 188 Q 196 198 200 208"/>
    <path d="M 210 142 Q 204 152 212 162"/>
    <path d="M 242 104 Q 246 112 250 122"/>
    <path d="M 282 96 Q 290 88 294 94"/>
  </g>

  <!-- legend -->
  <text x="320" y="20" text-anchor="middle" fill="#E2E8F0" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="600">15 human grammars — every one says BIND a little differently</text>
</svg>
