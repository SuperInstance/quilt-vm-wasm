<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="softglow5">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow5" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="640" height="320" fill="#0F172A"/>

  <!-- title -->
  <text x="20" y="28" fill="#E2E8F0" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700">The 5 Algebraic Laws</text>
  <text x="20" y="46" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="11">Before, arrow, after — every transformation has an inverse</text>

  <!-- 5 laws in 5 columns. Each col is 124 wide. -->
  <!-- Law 1: BIND ∘ BIND = BIND  (idempotence) -->
  <g transform="translate(20,80)">
    <text x="60" y="0" text-anchor="middle" fill="#3B82F6" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">1. BIND·BIND = BIND</text>
    <text x="60" y="14" text-anchor="middle" fill="#64748B" font-family="ui-sans-serif,system-ui" font-size="9">(idempotent)</text>
    <!-- before -->
    <g transform="translate(20,40)">
      <circle cx="0" cy="0" r="6" fill="#3B82F6" stroke="#1E40AF" stroke-width="1"/>
      <text x="0" y="20" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="8">a</text>
      <circle cx="16" cy="0" r="6" fill="#3B82F6" stroke="#1E40AF" stroke-width="1"/>
      <text x="16" y="20" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="8">a</text>
    </g>
    <line x1="48" y1="40" x2="64" y2="40" stroke="#94A3B8" stroke-width="1" marker-end="url(#arrow5)"/>
    <!-- after -->
    <g transform="translate(80,40)">
      <circle cx="0" cy="0" r="6" fill="#3B82F6" stroke="#1E40AF" stroke-width="1"/>
      <text x="0" y="20" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="8">a</text>
    </g>
    <text x="60" y="86" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="8">binding twice = once</text>
  </g>

  <!-- Law 2: LINK ∘ LINK-1 = id  (invertibility) -->
  <g transform="translate(144,80)">
    <text x="60" y="0" text-anchor="middle" fill="#10B981" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">2. LINK∘LINK⁻¹ = id</text>
    <text x="60" y="14" text-anchor="middle" fill="#64748B" font-family="ui-sans-serif,system-ui" font-size="9">(invertible)</text>
    <!-- before: a→b -->
    <g transform="translate(15,40)">
      <circle cx="0" cy="0" r="5" fill="#10B981"/>
      <line x1="6" y1="0" x2="22" y2="0" stroke="#10B981" stroke-width="1.2" marker-end="url(#arrow5)"/>
      <circle cx="28" cy="0" r="5" fill="#10B981"/>
    </g>
    <line x1="48" y1="40" x2="64" y2="40" stroke="#94A3B8" stroke-width="1" marker-end="url(#arrow5)"/>
    <!-- after: unlinked (empty) -->
    <g transform="translate(80,40)">
      <circle cx="0" cy="0" r="5" fill="#475569"/>
      <circle cx="20" cy="0" r="5" fill="#475569"/>
    </g>
    <text x="60" y="86" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="8">unlinking undoes linking</text>
  </g>

  <!-- Law 3: EFFECT·EFFECT⁻¹ = id  (undo) -->
  <g transform="translate(268,80)">
    <text x="60" y="0" text-anchor="middle" fill="#DC2626" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">3. EFFECT·EFFECT⁻¹=id</text>
    <text x="60" y="14" text-anchor="middle" fill="#64748B" font-family="ui-sans-serif,system-ui" font-size="9">(undo)</text>
    <!-- before: cell with red overlay (mutation) -->
    <g transform="translate(20,40)">
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#1E293B" stroke="#DC2626" stroke-width="1.2"/>
      <line x1="-8" y1="-3" x2="8" y2="-3" stroke="#DC2626" stroke-width="0.6"/>
      <text x="0" y="20" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="7">42 → 17</text>
    </g>
    <line x1="48" y1="40" x2="64" y2="40" stroke="#94A3B8" stroke-width="1" marker-end="url(#arrow5)"/>
    <!-- after: cell with previous value -->
    <g transform="translate(80,40)">
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
      <line x1="-8" y1="-3" x2="8" y2="-3" stroke="#10B981" stroke-width="0.6"/>
      <text x="0" y="20" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="7">17 → 42</text>
    </g>
    <text x="60" y="86" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="8">undo restores state</text>
  </g>

  <!-- Law 4: VIEW∘EFFECT = VIEW  (referential transparency) -->
  <g transform="translate(392,80)">
    <text x="60" y="0" text-anchor="middle" fill="#A855F7" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">4. VIEW·EFFECT = VIEW</text>
    <text x="60" y="14" text-anchor="middle" fill="#64748B" font-family="ui-sans-serif,system-ui" font-size="9">(transparent)</text>
    <!-- before: cell, after effect, view returns same -->
    <g transform="translate(20,40)">
      <circle cx="0" cy="0" r="5" fill="#A855F7"/>
      <text x="0" y="20" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="7">x</text>
    </g>
    <line x1="48" y1="40" x2="64" y2="40" stroke="#94A3B8" stroke-width="1" marker-end="url(#arrow5)"/>
    <g transform="translate(80,40)">
      <circle cx="0" cy="0" r="5" fill="#A855F7"/>
      <text x="0" y="20" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="7">x (same)</text>
    </g>
    <text x="60" y="86" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="8">views see consistent state</text>
  </g>

  <!-- Law 5: TICK·TICK = TICK(2dt)  (composability) -->
  <g transform="translate(516,80)">
    <text x="60" y="0" text-anchor="middle" fill="#F59E0B" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">5. TICK∘TICK = TICK(2)</text>
    <text x="60" y="14" text-anchor="middle" fill="#64748B" font-family="ui-sans-serif,system-ui" font-size="9">(composable)</text>
    <!-- before: two clocks -->
    <g transform="translate(10,40)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#F59E0B" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="-5" stroke="#F59E0B" stroke-width="1"/>
      <text x="0" y="18" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="7">1s</text>
    </g>
    <g transform="translate(28,40)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#F59E0B" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="-5" stroke="#F59E0B" stroke-width="1"/>
      <text x="0" y="18" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="7">1s</text>
    </g>
    <line x1="48" y1="40" x2="64" y2="40" stroke="#94A3B8" stroke-width="1" marker-end="url(#arrow5)"/>
    <g transform="translate(80,40)">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#F59E0B" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="4" y2="-5" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="0" y="20" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="7">2s</text>
    </g>
    <text x="60" y="86" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="8">time composes</text>
  </g>

  <!-- bottom: single combined law -->
  <rect x="20" y="200" width="600" height="40" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="320" y="220" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace,monospace" font-size="13" font-weight="600">BIND∘LINK∘EFFECT∘VIEW∘TICK = a runtime</text>
  <text x="320" y="234" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="10">— and a runtime is a function from context to value with an inverse, advanced by a clock —</text>

  <!-- footer note -->
  <text x="320" y="280" text-anchor="middle" fill="#64748B" font-family="ui-sans-serif,system-ui" font-size="10" font-style="italic">Every property that makes a language good lives in this algebra.</text>
  <text x="320" y="298" text-anchor="middle" fill="#475569" font-family="ui-sans-serif,system-ui" font-size="9" font-style="italic">The 5 laws are the same in Python, Rust, C, TypeScript, Haskell, and WASM.</text>
</svg>
