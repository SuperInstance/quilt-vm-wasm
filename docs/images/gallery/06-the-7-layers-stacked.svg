<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bread6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softglow6">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="#0F172A"/>

  <!-- title -->
  <text x="20" y="28" fill="#E2E8F0" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700">The 7 Layers — a Runtime Sandwich</text>
  <text x="20" y="46" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="11">Stacked from metal (bottom) to meaning (top), each layer a different formalism</text>

  <!-- 7 layers stacked vertically. Center x=320, total stack ~210 tall. Each layer 24 tall, gap 2. Start y=70 -->
  <!-- Top "bread": grammar -->
  <g transform="translate(0,70)">
    <rect x="180" y="0" width="280" height="24" rx="6" fill="url(#bread6)" stroke="#92400E" stroke-width="1"/>
    <text x="320" y="16" text-anchor="middle" fill="#451A03" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">7 · human grammar</text>
    <!-- tiny pic: speech bubble -->
    <g transform="translate(200,12)">
      <rect x="-8" y="-5" width="16" height="9" rx="3" fill="#451A03" stroke="#451A03" stroke-width="0.8"/>
      <polygon points="-2,4 0,7 2,4" fill="#451A03"/>
    </g>
  </g>

  <!-- Layer 6: language syntax -->
  <g transform="translate(0,98)">
    <rect x="180" y="0" width="280" height="24" rx="4" fill="#0E7490" stroke="#06B6D4" stroke-width="1"/>
    <text x="320" y="16" text-anchor="middle" fill="#A5F3FC" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">6 · language syntax</text>
    <!-- tiny pic: code brackets -->
    <g transform="translate(200,12)" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#A5F3FC">
      <text x="-5" y="3">{ }</text>
    </g>
  </g>

  <!-- Layer 5: GC -->
  <g transform="translate(0,126)">
    <rect x="180" y="0" width="280" height="24" rx="4" fill="#7F1D1D" stroke="#DC2626" stroke-width="1"/>
    <text x="320" y="16" text-anchor="middle" fill="#FCA5A5" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">5 · garbage collector</text>
    <!-- tiny pic: trash can -->
    <g transform="translate(200,12)">
      <rect x="-4" y="-3" width="8" height="9" fill="none" stroke="#FCA5A5" stroke-width="0.8"/>
      <line x1="-6" y1="-4" x2="6" y2="-4" stroke="#FCA5A5" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Layer 4: optimizer -->
  <g transform="translate(0,154)">
    <rect x="180" y="0" width="280" height="24" rx="4" fill="#92400E" stroke="#F59E0B" stroke-width="1"/>
    <text x="320" y="16" text-anchor="middle" fill="#FDE68A" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">4 · optimizer</text>
    <!-- tiny pic: gear -->
    <g transform="translate(200,12)">
      <circle cx="0" cy="0" r="4" fill="none" stroke="#FDE68A" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.5" fill="#FDE68A"/>
      <line x1="0" y1="-6" x2="0" y2="-4" stroke="#FDE68A" stroke-width="0.8"/>
      <line x1="0" y1="4" x2="0" y2="6" stroke="#FDE68A" stroke-width="0.8"/>
      <line x1="-6" y1="0" x2="-4" y2="0" stroke="#FDE68A" stroke-width="0.8"/>
      <line x1="4" y1="0" x2="6" y2="0" stroke="#FDE68A" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Layer 3: linker -->
  <g transform="translate(0,182)">
    <rect x="180" y="0" width="280" height="24" rx="4" fill="#581C87" stroke="#A855F7" stroke-width="1"/>
    <text x="320" y="16" text-anchor="middle" fill="#E9D5FF" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">3 · linker</text>
    <!-- tiny pic: chain links -->
    <g transform="translate(200,12)">
      <rect x="-6" y="-2" width="6" height="4" fill="none" stroke="#E9D5FF" stroke-width="0.8"/>
      <rect x="-1" y="-2" width="6" height="4" fill="none" stroke="#E9D5FF" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Layer 2: types -->
  <g transform="translate(0,210)">
    <rect x="180" y="0" width="280" height="24" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="320" y="16" text-anchor="middle" fill="#A7F3D0" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">2 · types</text>
    <!-- tiny pic: A -> B -->
    <g transform="translate(200,12)" font-family="ui-monospace,monospace" font-size="9" fill="#A7F3D0">
      <text x="-8" y="3">A→B</text>
    </g>
  </g>

  <!-- Layer 1: bytecode (bottom) -->
  <g transform="translate(0,238)">
    <rect x="180" y="0" width="280" height="24" rx="4" fill="#1E40AF" stroke="#3B82F6" stroke-width="1"/>
    <text x="320" y="16" text-anchor="middle" fill="#BFDBFE" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700">1 · bytecode (metal)</text>
    <!-- tiny pic: 0x -->
    <g transform="translate(200,12)" font-family="ui-monospace,monospace" font-size="9" fill="#BFDBFE">
      <text x="-7" y="3">0x4F</text>
    </g>
  </g>

  <!-- bottom bread: substrate (the foundation) -->
  <g transform="translate(0,266)">
    <rect x="180" y="0" width="280" height="20" rx="6" fill="url(#bread6)" stroke="#92400E" stroke-width="1"/>
    <text x="320" y="14" text-anchor="middle" fill="#451A03" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">the substrate — cell-graph (foundation)</text>
  </g>

  <!-- left bracket: "the runtime" -->
  <g stroke="#94A3B8" stroke-width="1" fill="none">
    <path d="M 160 70 L 150 70 L 150 290 L 160 290"/>
  </g>
  <text x="142" y="184" text-anchor="middle" fill="#E2E8F0" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700"
        transform="rotate(-90 142 184)">the runtime</text>

  <!-- right side: small label arrows -->
  <g font-family="ui-sans-serif,system-ui" font-size="8" fill="#94A3B8" text-anchor="start">
    <line x1="468" y1="82" x2="490" y2="82" stroke="#94A3B8" stroke-width="0.5"/>
    <text x="494" y="85">meaning</text>
    <line x1="468" y1="138" x2="490" y2="138" stroke="#94A3B8" stroke-width="0.5"/>
    <text x="494" y="141">memory</text>
    <line x1="468" y1="166" x2="490" y2="166" stroke="#94A3B8" stroke-width="0.5"/>
    <text x="494" y="169">fuse</text>
    <line x1="468" y1="194" x2="490" y2="194" stroke="#94A3B8" stroke-width="0.5"/>
    <text x="494" y="197">resolve</text>
    <line x1="468" y1="222" x2="490" y2="222" stroke="#94A3B8" stroke-width="0.5"/>
    <text x="494" y="225">check</text>
    <line x1="468" y1="250" x2="490" y2="250" stroke="#94A3B8" stroke-width="0.5"/>
    <text x="494" y="253">execute</text>
    <text x="494" y="280" fill="#64748B">↓ substrate</text>
  </g>

  <!-- left side: small label arrows -->
  <g font-family="ui-sans-serif,system-ui" font-size="8" fill="#94A3B8" text-anchor="end">
    <line x1="172" y1="82" x2="150" y2="82" stroke="#94A3B8" stroke-width="0.5"/>
    <text x="146" y="85">poet speaks</text>
    <line x1="172" y1="250" x2="150" y2="250" stroke="#94A3B8" stroke-width="0.5"/>
    <text x="146" y="253">chip runs</text>
  </g>
</svg>
