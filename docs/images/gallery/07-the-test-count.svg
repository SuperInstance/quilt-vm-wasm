<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="softglow7">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="#0F172A"/>

  <!-- title -->
  <text x="20" y="28" fill="#E2E8F0" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700">The Test Count</text>
  <text x="20" y="46" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="11">713+ tests across 11 repos — the polyformalism, exhaustively checked</text>

  <!-- chart area: x=80 to x=620, y=70 to y=270. Bar area: y=70..260 (max=405 -> 190px tall) -->
  <!-- y-axis gridlines + labels: 0,100,200,300,400 -->
  <g stroke="#1E293B" stroke-width="0.5" fill="none">
    <line x1="80" y1="260" x2="620" y2="260"/>
    <line x1="80" y1="213" x2="620" y2="213" stroke-dasharray="2 3"/>
    <line x1="80" y1="166" x2="620" y2="166" stroke-dasharray="2 3"/>
    <line x1="80" y1="119" x2="620" y2="119" stroke-dasharray="2 3"/>
    <line x1="80" y1="72" x2="620" y2="72" stroke-dasharray="2 3"/>
  </g>
  <g font-family="ui-sans-serif,system-ui" font-size="9" fill="#64748B" text-anchor="end">
    <text x="74" y="263">0</text>
    <text x="74" y="216">100</text>
    <text x="74" y="169">200</text>
    <text x="74" y="122">300</text>
    <text x="74" y="75">400</text>
  </g>

  <!-- 11 bars, each 40 wide with 8px gap. 11*40 + 10*8 = 440 + 80 = 520. Start x=90. -->
  <!-- Scale: 1 test = 0.47px. (405 tests -> 190px height) -->
  <!-- helper: y_bottom - 0.47*count -->
  <g font-family="ui-sans-serif,system-ui" font-size="9" fill="#E2E8F0" text-anchor="middle">
    <!-- 1. quilt-substrate 405 -->
    <rect x="90" y="70" width="40" height="190" fill="#10B981" filter="url(#softglow7)"/>
    <text x="110" y="63" font-weight="700" fill="#A7F3D0">405</text>
    <text x="110" y="275" font-size="8" fill="#94A3B8">substrate</text>
    <!-- 2. quilt-linker 13 -->
    <rect x="138" y="254" width="40" height="6" fill="#A855F7"/>
    <text x="158" y="247" font-weight="700" fill="#E9D5FF">13</text>
    <text x="158" y="275" font-size="8" fill="#94A3B8">linker</text>
    <!-- 3. quilt-opt 11 -->
    <rect x="186" y="255" width="40" height="5" fill="#F59E0B"/>
    <text x="206" y="248" font-weight="700" fill="#FDE68A">11</text>
    <text x="206" y="275" font-size="8" fill="#94A3B8">opt</text>
    <!-- 4. quilt-gc 12 -->
    <rect x="234" y="254" width="40" height="6" fill="#DC2626"/>
    <text x="254" y="247" font-weight="700" fill="#FCA5A5">12</text>
    <text x="254" y="275" font-size="8" fill="#94A3B8">gc</text>
    <!-- 5. quilt-types 16 -->
    <rect x="282" y="252" width="40" height="8" fill="#3B82F6"/>
    <text x="302" y="245" font-weight="700" fill="#BFDBFE">16</text>
    <text x="302" y="275" font-size="8" fill="#94A3B8">types</text>
    <!-- 6. quilt-vm-wasm 5 -->
    <rect x="330" y="258" width="40" height="2" fill="#06B6D4"/>
    <text x="350" y="251" font-weight="700" fill="#A5F3FC">5</text>
    <text x="350" y="275" font-size="8" fill="#94A3B8">vm-wasm</text>
    <!-- 7. quilt-vm-c 6 -->
    <rect x="378" y="257" width="40" height="3" fill="#FCD34D"/>
    <text x="398" y="250" font-weight="700" fill="#FDE68A">6</text>
    <text x="398" y="275" font-size="8" fill="#94A3B8">vm-c</text>
    <!-- 8. quilt-vm-rust 7 -->
    <rect x="426" y="257" width="40" height="3" fill="#EC4899"/>
    <text x="446" y="250" font-weight="700" fill="#F9A8D4">7</text>
    <text x="446" y="275" font-size="8" fill="#94A3B8">vm-rust</text>
    <!-- 9. quilt-vm-haskell 6 -->
    <rect x="474" y="257" width="40" height="3" fill="#A855F7"/>
    <text x="494" y="250" font-weight="700" fill="#E9D5FF">6</text>
    <text x="494" y="275" font-size="8" fill="#94A3B8">vm-hs</text>
    <!-- 10. quilt-vm-typescript 6 -->
    <rect x="522" y="257" width="40" height="3" fill="#10B981"/>
    <text x="542" y="250" font-weight="700" fill="#A7F3D0">6</text>
    <text x="542" y="275" font-size="8" fill="#94A3B8">vm-ts</text>
    <!-- 11. quilt-polyformalism-dsl 7 -->
    <rect x="570" y="257" width="40" height="3" fill="#F59E0B"/>
    <text x="590" y="250" font-weight="700" fill="#FDE68A">7</text>
    <text x="590" y="275" font-size="8" fill="#94A3B8">pdsl</text>
  </g>

  <!-- x-axis -->
  <line x1="80" y1="260" x2="620" y2="260" stroke="#475569" stroke-width="1"/>
  <text x="350" y="295" text-anchor="middle" fill="#64748B" font-family="ui-sans-serif,system-ui" font-size="9">repo (11 total · 713+ tests)</text>

  <!-- callout for substrate -->
  <g>
    <line x1="110" y1="70" x2="110" y2="58" stroke="#10B981" stroke-width="0.5"/>
    <text x="110" y="55" text-anchor="middle" fill="#A7F3D0" font-family="ui-sans-serif,system-ui" font-size="9" font-weight="700">405 ← substrate is where the action is</text>
  </g>
</svg>
