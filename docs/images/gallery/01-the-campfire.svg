<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <radialGradient id="fire1" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#FFE5A0" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="#0F172A"/>

  <!-- stars -->
  <g fill="#FFF" opacity="0.55">
    <circle cx="40" cy="30" r="0.8"/>
    <circle cx="120" cy="50" r="1.1"/>
    <circle cx="280" cy="20" r="0.6"/>
    <circle cx="450" cy="40" r="1.0"/>
    <circle cx="580" cy="25" r="0.7"/>
    <circle cx="610" cy="80" r="1.2"/>
    <circle cx="20" cy="160" r="0.5"/>
    <circle cx="600" cy="200" r="0.8"/>
    <circle cx="80" cy="280" r="0.9"/>
  </g>

  <!-- title -->
  <text x="20" y="32" fill="#E2E8F0" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700">The Campfire</text>
  <text x="20" y="50" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="11">Five logs, eight tendrils, one universal fire</text>

  <!-- 8 tendrils radiating from center fire at (320,200) -->
  <g stroke-width="2" fill="none" filter="url(#softglow1)" opacity="0.85">
    <!-- spreadsheet — top -->
    <path d="M 320 200 Q 290 130 240 80" stroke="#3B82F6"/>
    <!-- TTRPG — top right -->
    <path d="M 320 200 Q 400 130 470 80" stroke="#DC2626"/>
    <!-- neural net — right -->
    <path d="M 320 200 Q 430 200 540 180" stroke="#06B6D4"/>
    <!-- database — bottom right -->
    <path d="M 320 200 Q 420 240 510 280" stroke="#10B981"/>
    <!-- MUD — bottom -->
    <path d="M 320 200 Q 320 260 300 295" stroke="#A855F7"/>
    <!-- Notion — bottom left -->
    <path d="M 320 200 Q 220 240 130 280" stroke="#FCD34D"/>
    <!-- TTRPG map — left -->
    <path d="M 320 200 Q 200 200 90 180" stroke="#F59E0B"/>
    <!-- chat agent — top left -->
    <path d="M 320 200 Q 240 130 170 80" stroke="#EC4899"/>
  </g>

  <!-- 8 camps at the end of tendrils (small icons) -->
  <!-- spreadsheet (cells) -->
  <g transform="translate(240,80)">
    <rect x="-22" y="-16" width="44" height="32" rx="3" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="-7" y1="-16" x2="-7" y2="16" stroke="#3B82F6" stroke-width="1"/>
    <line x1="7" y1="-16" x2="7" y2="16" stroke="#3B82F6" stroke-width="1"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#3B82F6" stroke-width="1"/>
    <text x="0" y="-20" text-anchor="middle" fill="#BFDBFE" font-family="ui-sans-serif,system-ui" font-size="9">spreadsheet</text>
  </g>
  <!-- TTRPG (d20 die) -->
  <g transform="translate(470,80)">
    <polygon points="0,-14 12,0 0,14 -12,0" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#FCA5A5" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">20</text>
    <text x="0" y="-20" text-anchor="middle" fill="#FCA5A5" font-family="ui-sans-serif,system-ui" font-size="9">ttrpg</text>
  </g>
  <!-- neural net (nodes) -->
  <g transform="translate(540,180)">
    <circle cx="-14" cy="-6" r="3" fill="#06B6D4"/>
    <circle cx="-14" cy="6" r="3" fill="#06B6D4"/>
    <circle cx="0" cy="0" r="3" fill="#67E8F9"/>
    <circle cx="14" cy="-6" r="3" fill="#06B6D4"/>
    <circle cx="14" cy="6" r="3" fill="#06B6D4"/>
    <line x1="-14" y1="-6" x2="0" y2="0" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="-14" y1="6" x2="0" y2="0" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="14" y2="-6" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="14" y2="6" stroke="#06B6D4" stroke-width="0.8"/>
    <text x="0" y="-20" text-anchor="middle" fill="#A5F3FC" font-family="ui-sans-serif,system-ui" font-size="9">neural net</text>
  </g>
  <!-- database (cylinders) -->
  <g transform="translate(510,280)">
    <ellipse cx="0" cy="-9" rx="12" ry="3" fill="none" stroke="#10B981" stroke-width="1.2"/>
    <line x1="-12" y1="-9" x2="-12" y2="9" stroke="#10B981" stroke-width="1.2"/>
    <line x1="12" y1="-9" x2="12" y2="9" stroke="#10B981" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="12" ry="3" fill="none" stroke="#10B981" stroke-width="1.2"/>
    <ellipse cx="0" cy="9" rx="12" ry="3" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="1.2"/>
    <text x="0" y="22" text-anchor="middle" fill="#A7F3D0" font-family="ui-sans-serif,system-ui" font-size="9">database</text>
  </g>
  <!-- MUD (terminal) -->
  <g transform="translate(300,295)">
    <rect x="-15" y="-9" width="30" height="18" rx="2" fill="#1E293B" stroke="#A855F7" stroke-width="1.2"/>
    <text x="-10" y="3" fill="#E9D5FF" font-family="ui-monospace,monospace" font-size="8">&gt;_</text>
    <text x="0" y="22" text-anchor="middle" fill="#E9D5FF" font-family="ui-sans-serif,system-ui" font-size="9">mud</text>
  </g>
  <!-- Notion (page) -->
  <g transform="translate(130,280)">
    <rect x="-12" y="-12" width="24" height="24" rx="1" fill="#1E293B" stroke="#FCD34D" stroke-width="1.2"/>
    <line x1="-8" y1="-7" x2="8" y2="-7" stroke="#FCD34D" stroke-width="0.8"/>
    <line x1="-8" y1="-2" x2="6" y2="-2" stroke="#FCD34D" stroke-width="0.8"/>
    <line x1="-8" y1="3" x2="8" y2="3" stroke="#FCD34D" stroke-width="0.8"/>
    <line x1="-8" y1="8" x2="3" y2="8" stroke="#FCD34D" stroke-width="0.8"/>
    <text x="0" y="22" text-anchor="middle" fill="#FDE68A" font-family="ui-sans-serif,system-ui" font-size="9">notion</text>
  </g>
  <!-- TTRPG map (hex) -->
  <g transform="translate(90,180)">
    <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="0" y="2" text-anchor="middle" fill="#FCD34D" font-family="ui-sans-serif,system-ui" font-size="8">M</text>
    <text x="0" y="-18" text-anchor="middle" fill="#FCD34D" font-family="ui-sans-serif,system-ui" font-size="9">ttrpg map</text>
  </g>
  <!-- chat agent (speech bubble) -->
  <g transform="translate(170,80)">
    <rect x="-12" y="-9" width="24" height="14" rx="4" fill="#1E293B" stroke="#EC4899" stroke-width="1.2"/>
    <polygon points="-3,5 0,9 3,5" fill="#1E293B" stroke="#EC4899" stroke-width="1.2"/>
    <circle cx="-5" cy="-2" r="1" fill="#EC4899"/>
    <circle cx="0" cy="-2" r="1" fill="#EC4899"/>
    <circle cx="5" cy="-2" r="1" fill="#EC4899"/>
    <text x="0" y="-15" text-anchor="middle" fill="#F9A8D4" font-family="ui-sans-serif,system-ui" font-size="9">chat agent</text>
  </g>

  <!-- the campfire at center: 5 logs arranged in a star (pentagon) -->
  <g transform="translate(320,200)">
    <!-- halo -->
    <circle cx="0" cy="0" r="60" fill="url(#halo1)"/>
    <!-- 5 logs (5 opcodes) arranged as a star — pentagon -->
    <g stroke="#7C2D12" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-8" stroke="#92400E" stroke-width="6"/>
      <line x1="21" y1="-7" x2="8" y2="-3" stroke="#92400E" stroke-width="6"/>
      <line x1="13" y1="18" x2="5" y2="7" stroke="#92400E" stroke-width="6"/>
      <line x1="-13" y1="18" x2="-5" y2="7" stroke="#92400E" stroke-width="6"/>
      <line x1="-21" y1="-7" x2="-8" y2="-3" stroke="#92400E" stroke-width="6"/>
    </g>
    <!-- flames -->
    <g filter="url(#glow1)">
      <ellipse cx="0" cy="0" rx="22" ry="18" fill="url(#fire1)"/>
      <path d="M 0 -16 Q -8 -6 -6 4 Q 0 12 6 4 Q 8 -6 0 -16 Z" fill="#FCD34D" opacity="0.95"/>
      <path d="M 0 -10 Q -4 -4 -3 2 Q 0 6 3 2 Q 4 -4 0 -10 Z" fill="#FFF" opacity="0.85"/>
    </g>
    <!-- 5 opcode labels on the logs -->
    <g font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="middle">
      <circle cx="0" cy="-32" r="9" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="0" y="-29" fill="#BFDBFE">B</text>
      <circle cx="32" cy="-10" r="9" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="32" y="-7" fill="#A7F3D0">L</text>
      <circle cx="20" cy="26" r="9" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
      <text x="20" y="29" fill="#FCA5A5">E</text>
      <circle cx="-20" cy="26" r="9" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
      <text x="-20" y="29" fill="#E9D5FF">V</text>
      <circle cx="-32" cy="-10" r="9" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="-32" y="-7" fill="#FCD34D">T</text>
    </g>
  </g>

  <!-- polyformalism ribbon -->
  <rect x="20" y="280" width="600" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="320" y="298" text-anchor="middle" fill="#E2E8F0" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="600">one substrate · many languages · many domains · one truth</text>
</svg>
